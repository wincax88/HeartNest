apiVersion: v1
kind: Service
metadata:
  name: heartnest-postgres
  namespace: ns-i61rahoe
  labels:
    app.kubernetes.io/name: heartnest-postgres
    app.kubernetes.io/part-of: heartnest
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: heartnest-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: heartnest-postgres
  namespace: ns-i61rahoe
  labels:
    app.kubernetes.io/name: heartnest-postgres
    app.kubernetes.io/part-of: heartnest
spec:
  serviceName: heartnest-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heartnest-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heartnest-postgres
        app.kubernetes.io/part-of: heartnest
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: heartnest
            - name: POSTGRES_USER
              value: heartnest_app
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: heartnest-postgres
                  key: POSTGRES_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U heartnest_app -d heartnest"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U heartnest_app -d heartnest"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: heartnest-postgres
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
