apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: heartnest-backups, namespace: ns-i61rahoe }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: heartnest-backup, namespace: ns-i61rahoe }
spec:
  schedule: "17 2 * * *"
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets: [{ name: heartnest-registry }]
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: backup
              image: __BACKUP_IMAGE__
              command: [sh, -ec]
              args:
                - |
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  target="/backups/heartnest-${stamp}.dump.enc"
                  pg_dump --format=custom "$DATABASE_URL" | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:BACKUP_ENCRYPTION_KEY -out "$target"
                  test -s "$target"
                  sha256sum "$target" > "${target}.sha256"
                  find /backups -type f -name 'heartnest-*.dump.enc*' -mtime +30 -delete
                  printf '{"status":"ok","backup":"%s","completedAt":"%s"}\n' "$(basename "$target")" "$(date -u +%FT%TZ)" | tee /backups/latest-backup-status.json
              env:
                - name: DATABASE_URL
                  valueFrom: { secretKeyRef: { name: heartnest-runtime, key: DATABASE_URL } }
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom: { secretKeyRef: { name: heartnest-backup, key: BACKUP_ENCRYPTION_KEY } }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              volumeMounts: [{ name: backups, mountPath: /backups }]
          volumes: [{ name: backups, persistentVolumeClaim: { claimName: heartnest-backups } }]
