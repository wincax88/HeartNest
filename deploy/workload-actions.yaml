apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartnest-web
  namespace: ns-i61rahoe
  labels:
    app.kubernetes.io/name: heartnest-web
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: heartnest-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heartnest-web
      annotations:
        heartnest.dev/release: "__RELEASE_SHA__"
        heartnest.dev/deploy-run: "__DEPLOY_RUN__"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: heartnest
          image: node:20-alpine
          command: ["node", "/site/releases/__RELEASE_SHA__/server/index.mjs"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: HEARTNEST_STATIC_ROOT
              value: /site/releases/__RELEASE_SHA__/public
            - name: HEARTNEST_DATA_FILE
              value: /site/data/heartnest.json
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: heartnest-runtime
                  key: DATABASE_URL
            - name: TOKEN_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: heartnest-runtime
                  key: TOKEN_SIGNING_KEY
            - name: DATA_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: heartnest-runtime
                  key: DATA_ENCRYPTION_KEY
            - name: WECHAT_MINI_APP_ID
              valueFrom:
                secretKeyRef:
                  name: heartnest-runtime
                  key: WECHAT_MINI_APP_ID
            - name: WECHAT_MINI_SECRET
              valueFrom:
                secretKeyRef:
                  name: heartnest-runtime
                  key: WECHAT_MINI_SECRET
            - name: WECHAT_APP_ID
              valueFrom:
                secretKeyRef:
                  name: heartnest-runtime
                  key: WECHAT_APP_ID
            - name: WECHAT_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: heartnest-runtime
                  key: WECHAT_APP_SECRET
            - name: WECHAT_H5_APP_ID
              valueFrom:
                secretKeyRef:
                  name: heartnest-runtime
                  key: WECHAT_H5_APP_ID
            - name: WECHAT_H5_SECRET
              valueFrom:
                secretKeyRef:
                  name: heartnest-runtime
                  key: WECHAT_H5_SECRET
            - name: DEEPSEEK_MODEL
              value: deepseek-flash
            - name: DEEPSEEK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: heartnest-ai
                  key: DEEPSEEK_API_KEY
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: site
              mountPath: /site
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: heartnest-web
---
apiVersion: v1
kind: Service
metadata:
  name: heartnest-web
  namespace: ns-i61rahoe
  labels:
    app.kubernetes.io/name: heartnest-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heartnest-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heartnest-web
  namespace: ns-i61rahoe
  labels:
    app.kubernetes.io/name: heartnest-web
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: heartnest-ns-i61rahoe.gzg.sealos.run
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heartnest-web
                port:
                  number: 80
  tls:
    - hosts:
        - heartnest-ns-i61rahoe.gzg.sealos.run
      secretName: wildcard-cert
