apiVersion: v1
kind: ConfigMap
metadata:
  name: heartnest-web
  namespace: ns-i61rahoe
  labels:
    app.kubernetes.io/name: heartnest-web
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
      }
      location /static/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
      }
      location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartnest-web
  namespace: ns-i61rahoe
  labels:
    app.kubernetes.io/name: heartnest-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heartnest-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heartnest-web
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: heartnest-web
        - name: nginx-config
          configMap:
            name: heartnest-web
---
apiVersion: v1
kind: Service
metadata:
  name: heartnest-web
  namespace: ns-i61rahoe
  labels:
    app.kubernetes.io/name: heartnest-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heartnest-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heartnest-web
  namespace: ns-i61rahoe
  labels:
    app.kubernetes.io/name: heartnest-web
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: heartnest-ns-i61rahoe.gzg.sealos.run
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heartnest-web
                port:
                  number: 80
  tls:
    - hosts:
        - heartnest-ns-i61rahoe.gzg.sealos.run
      secretName: wildcard-cert
