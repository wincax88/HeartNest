name: 部署 HeartNest 到 Sealos

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 已确认生产发布检查清单
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: heartnest-sealos-production
  cancel-in-progress: false

env:
  NAMESPACE: ns-i61rahoe
  PUBLIC_URL: https://heartnest-ns-i61rahoe.gzg.sealos.run
  IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/heartnest

jobs:
  release:
    if: inputs.confirm_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: heartnest-production
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: test, POSTGRES_DB: heartnest_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d heartnest_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: 测试全部产品链路
        working-directory: app
        env:
          DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/heartnest_test
        run: |
          npm ci
          npm test
          npm run test:integration
          npm run test:e2e
          npm run type-check
          npm run build:h5

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: 构建并推送不可变镜像
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: azure/setup-kubectl@v4
        with: { version: v1.29.15 }
      - name: 准备集群访问和运行密钥
        env:
          HEARTNEST_KUBECONFIG: ${{ secrets.HEARTNEST_KUBECONFIG }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
          RUNTIME_ENV: ${{ secrets.HEARTNEST_RUNTIME_ENV }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$HEARTNEST_KUBECONFIG" && test -n "$GHCR_PULL_TOKEN" && test -n "$GHCR_PULL_USER" && test -n "$RUNTIME_ENV" && test -n "$DEEPSEEK_API_KEY"
          printf '%s' "$HEARTNEST_KUBECONFIG" > "$RUNNER_TEMP/kubeconfig"
          printf '%s' "$RUNTIME_ENV" > "$RUNNER_TEMP/runtime.env"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"
          image="${IMAGE_REPOSITORY}@${{ steps.image.outputs.digest }}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          kubectl -n "$NAMESPACE" create secret docker-registry heartnest-registry --docker-server=ghcr.io --docker-username="$GHCR_PULL_USER" --docker-password="$GHCR_PULL_TOKEN" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic heartnest-runtime --from-env-file="$RUNNER_TEMP/runtime.env" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n "$NAMESPACE" create secret generic heartnest-ai --from-literal=DEEPSEEK_API_KEY="$DEEPSEEK_API_KEY" --dry-run=client -o yaml | kubectl apply -f -

      - name: 迁移数据库
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" apply -f deploy/postgres.yaml
          kubectl -n "$NAMESPACE" rollout status statefulset/heartnest-postgres --timeout=240s
          sed "s|__IMAGE__|$IMAGE|g" deploy/migrate-job.yaml > "$RUNNER_TEMP/migrate.yaml"
          kubectl -n "$NAMESPACE" delete job heartnest-db-migrate --ignore-not-found --wait=true
          kubectl apply -f "$RUNNER_TEMP/migrate.yaml"
          kubectl -n "$NAMESPACE" wait --for=condition=Complete job/heartnest-db-migrate --timeout=300s

      - name: 滚动发布并业务冒烟
        run: |
          set -euo pipefail
          sed "s|__IMAGE__|$IMAGE|g" deploy/app.yaml > "$RUNNER_TEMP/app.yaml"
          kubectl apply -f "$RUNNER_TEMP/app.yaml"
          if ! kubectl -n "$NAMESPACE" rollout status deployment/heartnest --timeout=300s; then
            kubectl -n "$NAMESPACE" rollout undo deployment/heartnest
            exit 1
          fi
          if ! curl --fail --show-error --silent --retry 5 --retry-all-errors "$PUBLIC_URL/api/health" | jq -e '.ok == true'; then
            kubectl -n "$NAMESPACE" rollout undo deployment/heartnest
            kubectl -n "$NAMESPACE" rollout status deployment/heartnest --timeout=240s
            exit 1
          fi
